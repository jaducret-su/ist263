<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Participation 12</title>
  <style>
    #myDiv {
      cursor: pointer;
      font-size: 24px;
      color: black;
    }
  </style>
</head>
<body>

<div id="myDiv">Syracuse University</div>

<script>
  const div = document.getElementById("myDiv");

  div.addEventListener("click", function() {
    div.textContent = "Orange Nation";
    div.style.color = "orange";
  });
</script>

</body>
</html>
